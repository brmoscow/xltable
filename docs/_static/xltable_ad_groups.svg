<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-label="Block diagram: Excel connects over HTTPS to the authenticating front, which validates the Kerberos ticket against the domain controllers and passes the verified identity to XLTable; XLTable reads the user's AD groups over LDAP and applies them to access, the admin console and cube roles before querying the analytical database." font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>

  <text x="550" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">XLTable — Active Directory sign-in and AD-group authorization</text>

  <!-- Users -->
  <rect x="20" y="132" width="175" height="95" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="107" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Domain users</text>
  <text x="107" y="182" text-anchor="middle" font-size="13" fill="#222">Excel / browser</text>
  <text x="107" y="200" text-anchor="middle" font-size="12" fill="#555">domain workstations</text>

  <!-- XLTable server boundary -->
  <rect x="280" y="75" width="530" height="250" fill="none" stroke="#7b2d8b" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="795" y="98" text-anchor="end" font-size="15" font-weight="bold" fill="#7b2d8b">XLTable server</text>

  <!-- Front -->
  <rect x="320" y="130" width="180" height="115" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="410" y="157" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">Authenticating front</text>
  <text x="410" y="177" text-anchor="middle" font-size="12.5" fill="#222">Apache mod_auth_gssapi</text>
  <text x="410" y="194" text-anchor="middle" font-size="12.5" fill="#222">(Linux) or IIS (Windows)</text>
  <text x="410" y="213" text-anchor="middle" font-size="12" fill="#555">TLS + Kerberos, keytab</text>

  <!-- App -->
  <rect x="580" y="130" width="180" height="115" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="670" y="157" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">XLTable application</text>
  <text x="670" y="177" text-anchor="middle" font-size="12.5" fill="#222">worker processes</text>
  <text x="670" y="196" text-anchor="middle" font-size="12" fill="#555">listen on 127.0.0.1 only</text>

  <!-- 1: users -> front -->
  <line x1="195" y1="177" x2="318" y2="177" stroke="#222" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="256" y="160" text-anchor="middle" font-size="12" fill="#222">443 HTTPS</text>
  <circle cx="256" cy="177" r="11" fill="#ffffff" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="256" y="181.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b2d8b">1</text>
  <text x="256" y="200" text-anchor="middle" font-size="11" fill="#222">Kerberos SSO</text>
  <text x="256" y="215" text-anchor="middle" font-size="11" fill="#222">or login+password</text>

  <!-- 3: front -> app -->
  <line x1="500" y1="177" x2="578" y2="177" stroke="#222" stroke-width="1.3" marker-end="url(#arr)"/>
  <circle cx="540" cy="177" r="11" fill="#ffffff" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="540" y="181.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b2d8b">3</text>
  <line x1="540" y1="190" x2="540" y2="255" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="540" y="272" text-anchor="middle" font-size="11.5" fill="#222">X-Remote-User header</text>
  <text x="540" y="288" text-anchor="middle" font-size="11" fill="#555">identity only, no credentials</text>

  <!-- 5: app -> database -->
  <line x1="760" y1="177" x2="878" y2="177" stroke="#222" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="820" y="160" text-anchor="middle" font-size="12" fill="#222">SQL</text>
  <circle cx="820" cy="177" r="11" fill="#ffffff" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="820" y="181.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b2d8b">5</text>
  <text x="820" y="200" text-anchor="middle" font-size="11" fill="#222">role filters added</text>
  <text x="820" y="215" text-anchor="middle" font-size="11" fill="#222">to WHERE</text>

  <!-- Database cylinder -->
  <path d="M880,215 A95,13 0 0 0 1070,215 L1070,147 A95,13 0 0 0 880,147 Z" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="975" cy="147" rx="95" ry="13" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="975" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">Analytical database</text>
  <text x="975" y="204" text-anchor="middle" font-size="12" fill="#555">ClickHouse, Greenplum, ...</text>

  <!-- 2: front -> AD (Kerberos) -->
  <line x1="390" y1="245" x2="390" y2="428" stroke="#222" stroke-width="1.3" marker-end="url(#arr)"/>
  <circle cx="390" cy="337" r="11" fill="#ffffff" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="390" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b2d8b">2</text>
  <text x="375" y="365" text-anchor="end" font-size="12" fill="#222">Kerberos 88</text>
  <text x="375" y="382" text-anchor="end" font-size="11" fill="#555">ticket validation</text>
  <text x="375" y="397" text-anchor="end" font-size="11" fill="#555">(keytab)</text>

  <!-- 4: app -> AD (LDAP group lookup) -->
  <line x1="630" y1="245" x2="630" y2="428" stroke="#222" stroke-width="1.3" marker-end="url(#arr)"/>
  <circle cx="630" cy="337" r="11" fill="#ffffff" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="630" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b2d8b">4</text>
  <text x="645" y="365" text-anchor="start" font-size="12" fill="#222">LDAP(S) 389 / 636</text>
  <text x="645" y="382" text-anchor="start" font-size="11" fill="#555">service account reads</text>
  <text x="645" y="397" text-anchor="start" font-size="11" fill="#555">user's AD groups</text>

  <!-- Active Directory -->
  <rect x="330" y="430" width="340" height="95" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="500" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Active Directory</text>
  <text x="500" y="490" text-anchor="middle" font-size="12.5" fill="#222">domain controllers (KDC, LDAP)</text>

  <!-- Legend: what groups decide -->
  <rect x="720" y="400" width="360" height="150" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.2"/>
  <text x="738" y="428" font-size="13" font-weight="bold" fill="#222">What the AD groups decide</text>
  <text x="738" y="453" font-size="12.5" fill="#222">• access_groups — permission to connect</text>
  <text x="738" y="476" font-size="12.5" fill="#222">• ADMIN_GROUPS — admin console access</text>
  <text x="738" y="499" font-size="12.5" fill="#222">• cube roles — visible dimensions and</text>
  <text x="752" y="517" font-size="12.5" fill="#222">measures, row-level filters (WHERE)</text>

  <text x="550" y="600" text-anchor="middle" font-size="12" fill="#555">XLTable never receives domain passwords — the front passes only the verified user name;</text>
  <text x="550" y="618" text-anchor="middle" font-size="12" fill="#555">nested group membership is resolved by the domain controller (LDAP_MATCHING_RULE_IN_CHAIN).</text>
</svg>
